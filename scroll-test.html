<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Test — NOVA TLT</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow-x: hidden; }

  #load-corner {
    position: fixed; bottom: 24px; right: 24px; z-index: 500;
    display: flex; align-items: center; gap: 10px;
    transition: opacity 0.5s ease;
  }
  #load-corner.done { opacity: 0; pointer-events: none; }
  #load-label { font-family: ui-sans-serif,system-ui,sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.28); }
  #load-track { width: 72px; height: 1px; background: rgba(255,255,255,0.1); }
  #load-fill  { height: 100%; width: 0%; background: #CA953D; transition: width 0.06s linear; }

  #sec { position: relative; height: 700vh; }
  #sec-sticky { position: sticky; top: 0; height: 100vh; background: #000; overflow: hidden; }
  #scrub-canvas { display: block; width: 100%; height: 100%; }

  #after {
    height: 60vh; background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.15);
    font-family: ui-sans-serif,system-ui,sans-serif;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="load-corner">
  <span id="load-label">Loading</span>
  <div id="load-track"><div id="load-fill"></div></div>
</div>

<div id="sec">
  <div id="sec-sticky">
    <canvas id="scrub-canvas"></canvas>
  </div>
</div>

<div id="after">Continue ↓</div>

<script>
(function(){
  var TOTAL = 150;
  var PATH  = 'assets/frames/ezgif-frame-';
  var EXT   = '.jpg';

  var canvas = document.getElementById('scrub-canvas');
  var ctx    = canvas.getContext('2d');
  var sec    = document.getElementById('sec');
  var corner = document.getElementById('load-corner');
  var fill   = document.getElementById('load-fill');

  var images   = new Array(TOTAL);
  var loaded   = 0;
  var ready    = false;
  var curFrame = -1;
  var PRELOAD  = 30; /* start scrubbing after first 30 frames */

  var W = window.innerWidth, H = window.innerHeight;

  function pad(n){ return String(n).padStart(3,'0'); }

  function drawFrame(idx){
    var img = images[idx];
    if(!img || !img.naturalWidth) return;
    canvas.width  = W;
    canvas.height = H;
    var s  = Math.max(W/img.naturalWidth, H/img.naturalHeight);
    var dw = img.naturalWidth*s, dh = img.naturalHeight*s;
    ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  }

  var rafPending = false;
  function onScroll(){
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(function(){ rafPending=false; tick(); });
  }

  function tick(){
    if(!ready) return;
    var rect  = sec.getBoundingClientRect();
    var room  = sec.offsetHeight - H;
    var p     = Math.min(Math.max(-rect.top / room, 0), 1);
    var frame = Math.min(Math.floor(p * (TOTAL - 1)), TOTAL - 1);
    if(frame !== curFrame){
      curFrame = frame;
      drawFrame(frame);
    }
  }

  for(var i=0; i<TOTAL; i++){
    (function(idx){
      var img = new Image();
      img.onload = img.onerror = function(){
        loaded++;
        fill.style.width = (loaded/TOTAL*100)+'%';
        if(loaded === PRELOAD && !ready){
          ready = true;
          curFrame = -1;
          tick();
        }
        if(loaded === TOTAL){
          setTimeout(function(){ corner.classList.add('done'); },300);
        }
      };
      img.src = PATH + pad(idx+1) + EXT;
      images[idx] = img;
    })(i);
  }

  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', function(){
    W = window.innerWidth; H = window.innerHeight;
    if(curFrame >= 0) drawFrame(curFrame);
  });

  tick();
})();
</script>
</body>
</html>
