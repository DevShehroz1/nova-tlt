<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Test — NOVA TLT</title>
<link rel="stylesheet" href="assets/css/main.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; cursor: auto; }
  html { scroll-behavior: auto; }
  body { background: #0a0a0a; overflow-x: hidden; }

  /* ── Preloader ── */
  #preload-bar {
    position: fixed; inset: 0; z-index: 999;
    background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    transition: opacity 0.6s ease;
  }
  #preload-bar.done { opacity: 0; pointer-events: none; }
  #preload-label {
    color: rgba(255,255,255,0.4);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  #preload-track { width: 180px; height: 1px; background: rgba(255,255,255,0.1); }
  #preload-fill  { height: 100%; width: 0%; background: #CA953D; transition: width 0.08s linear; }

  /* ════════════════════════════════════════
     PHASE 1 — Heading (sticky, 200vh scroll room)
  ════════════════════════════════════════ */
  #phase-heading {
    position: relative;
    height: 250vh;
  }
  #phase-heading-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: clamp(40px, 8vw, 100px) clamp(24px, 8vw, 120px);
    background: #0a0a0a;
    overflow: hidden;
  }

  #main-heading {
    font-family: BebasNeuePro, sans-serif;
    font-weight: 700;
    font-size: clamp(52px, 8vw, 120px);
    line-height: 0.95;
    color: #f5f0e8;
    letter-spacing: 0.01em;
    max-width: 14ch;
    /* Animate in on load */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.9s cubic-bezier(0.22,1,0.36,1), transform 0.9s cubic-bezier(0.22,1,0.36,1);
  }
  #main-heading.visible { opacity: 1; transform: translateY(0); }

  /* Description block — slides up over heading as you scroll */
  #desc-block {
    position: absolute;
    bottom: clamp(40px, 6vw, 80px);
    right: clamp(24px, 8vw, 120px);
    max-width: 480px;
    opacity: 0;
    transform: translateY(60px);
    transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1);
    pointer-events: none;
  }
  #desc-block.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

  #desc-text {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(15px, 1.4vw, 18px);
    line-height: 1.65;
    color: rgba(255,255,255,0.6);
    margin-bottom: 32px;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    border-radius: 9999px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .cta-btn--solid {
    background: linear-gradient(135deg, #B67C2A 0%, #CA953D 50%, #E5B85A 100%);
    color: #fff;
    border: none;
  }
  .cta-btn--solid:hover { background: linear-gradient(135deg, #a06a20 0%, #b5832e 50%, #d4a440 100%); }

  /* ════════════════════════════════════════
     PHASE 2 — Frame scrub (sticky, 600vh scroll room)
  ════════════════════════════════════════ */
  #phase-scrub {
    position: relative;
    height: 600vh;
  }
  #scrub-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    background: #000;
  }
  #scrub-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* After section */
  #after {
    height: 100vh;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.2);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- Preloader -->
<div id="preload-bar">
  <span id="preload-label">Loading</span>
  <div id="preload-track"><div id="preload-fill"></div></div>
</div>

<!-- ── Phase 1: Heading + Description ── -->
<div id="phase-heading">
  <div id="phase-heading-sticky">

    <h1 id="main-heading">For over 5 years, Nova&nbsp;TLT has delivered reliable logistics solutions</h1>

    <div id="desc-block">
      <p id="desc-text">Connecting Riyadh, Jeddah, Dammam and every region of the Kingdom through a single, seamless platform. Same-day dispatch, live tracking, and no long-term commitments required.</p>
      <a href="contact.html" class="cta-btn cta-btn--solid">Get a Quote</a>
    </div>

  </div>
</div>

<!-- ── Phase 2: Frame scrub ── -->
<div id="phase-scrub">
  <div id="scrub-sticky">
    <canvas id="scrub-canvas"></canvas>
  </div>
</div>

<!-- Content below -->
<div id="after">Continue ↓</div>

<script>
(function () {
  var FRAME_COUNT = 150;
  var FRAME_PATH  = 'assets/frames/ezgif-frame-';
  var FRAME_EXT   = '.jpg';

  var canvas  = document.getElementById('scrub-canvas');
  var ctx     = canvas.getContext('2d');
  var scrubEl = document.getElementById('phase-scrub');
  var headEl  = document.getElementById('phase-heading');
  var heading = document.getElementById('main-heading');
  var descBlock = document.getElementById('desc-block');
  var bar     = document.getElementById('preload-bar');
  var fill    = document.getElementById('preload-fill');

  var images  = new Array(FRAME_COUNT);
  var loaded  = 0;
  var ready   = false;
  var currentFrame = 0;

  function pad(n) { return String(n).padStart(3, '0'); }

  function drawFrame(idx) {
    var img = images[idx];
    if (!img || !img.naturalWidth) return;
    var cw = canvas.width  = canvas.offsetWidth;
    var ch = canvas.height = canvas.offsetHeight;
    var scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
    var dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
    ctx.drawImage(img, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
  }

  function onScroll() {
    var scrollY = window.scrollY;

    /* ── Phase 1 scroll: show description when 35% through heading section ── */
    var headHeight = headEl.offsetHeight - window.innerHeight;
    var headProgress = Math.min(Math.max(scrollY / headHeight, 0), 1);
    if (headProgress > 0.35) {
      descBlock.classList.add('visible');
    } else {
      descBlock.classList.remove('visible');
    }

    /* ── Phase 2 scroll: scrub frames ── */
    if (!ready) return;
    var scrubTop  = scrubEl.offsetTop;
    var scrubHeight = scrubEl.offsetHeight - window.innerHeight;
    var scrubScrolled = scrollY - scrubTop;
    var progress = Math.min(Math.max(scrubScrolled / scrubHeight, 0), 1);
    var frame = Math.min(Math.floor(progress * (FRAME_COUNT - 1)), FRAME_COUNT - 1);
    if (frame !== currentFrame) {
      currentFrame = frame;
      drawFrame(frame);
    }
  }

  function preload() {
    /* Trigger heading entrance */
    requestAnimationFrame(function() {
      heading.classList.add('visible');
    });

    for (var i = 1; i <= FRAME_COUNT; i++) {
      (function (idx) {
        var img = new Image();
        img.onload = img.onerror = function () {
          loaded++;
          fill.style.width = (loaded / FRAME_COUNT * 100) + '%';
          if (loaded === FRAME_COUNT) {
            ready = true;
            setTimeout(function() { bar.classList.add('done'); }, 200);
            drawFrame(0);
          }
        };
        img.src = FRAME_PATH + pad(idx) + FRAME_EXT;
        images[idx - 1] = img;
      })(i);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function() { drawFrame(currentFrame); });
  preload();
})();
</script>
</body>
</html>
